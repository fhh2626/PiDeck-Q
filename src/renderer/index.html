<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: pideck-pet: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <!-- Windows 任务栏/Alt-Tab 读这个标题；留空时只剩图标、没有软件名。 -->
    <title>PiDeck-Q</title>
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除；不依赖外部字体/图片，保证首帧极快。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #eef0f3;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1200px 600px at 50% 28%, rgba(15, 23, 42, 0.06), transparent 62%),
          linear-gradient(180deg, #f7f8f5 0%, #f1f3ef 55%, #ecefeb 100%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-logo {
        position: relative;
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        /* 与 build/icon.svg 品牌图标同一套黑渐变，保证启动画面与任务栏图标一致 */
        background: linear-gradient(145deg, #1c1c1e, #000000);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.18) inset,
          0 14px 32px rgba(15, 23, 42, 0.28),
          0 2px 8px rgba(15, 23, 42, 0.08);
      }
      .boot-logo::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 28px;
        border: 1px solid rgba(15, 23, 42, 0.14);
        animation: boot-ring 1.8s ease-out infinite;
        pointer-events: none;
      }
      .boot-logo svg {
        width: 48px;
        height: 48px;
      }

      .boot-title {
        color: #1f2937;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.01em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.2;
      }
      .boot-subtitle {
        color: #6b7280;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.3;
      }

      /* 以下选择器都带 #boot-overlay 前缀：上方的 "#boot-overlay *" reset 特异性为 (1,0,0)，
         单个类选择器 (0,1,0) 的 margin/padding 会被它覆盖。 */
      #boot-overlay .boot-detail {
        max-width: 420px;
        color: #6b7280;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
        word-break: break-word;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      #boot-overlay .boot-retry {
        margin-top: 4px;
        padding: 6px 18px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font-size: 13px;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        cursor: pointer;
      }

      #boot-overlay .boot-retry:hover {
        background: rgba(15, 23, 42, 0.06);
      }

      #boot-overlay[data-failed="true"] .boot-progress {
        display: none;
      }

      #boot-overlay[data-failed="true"] .boot-brand {
        animation: none;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #3f3f46, #18181b);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        70% {
          opacity: 0;
          transform: scale(1.08);
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background: #111315;
        }
        #boot-overlay {
          background:
            radial-gradient(1000px 520px at 50% 30%, rgba(255, 255, 255, 0.05), transparent 60%),
            linear-gradient(180deg, #15181b 0%, #111315 100%);
        }
        .boot-title {
          color: #f3f4f6;
        }
        .boot-subtitle {
          color: #9ca3af;
        }
        #boot-overlay .boot-detail {
          color: #9ca3af;
        }
        #boot-overlay .boot-retry {
          border-color: rgba(255, 255, 255, 0.2);
          color: #f3f4f6;
        }
        #boot-overlay .boot-retry:hover {
          background: rgba(255, 255, 255, 0.08);
        }
        .boot-progress {
          background: rgba(255, 255, 255, 0.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-logo::after,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo">
          <svg viewBox="140 140 520 520" aria-hidden="true">
            <defs>
              <linearGradient id="boot-logo-silver" x1="0.2" y1="0" x2="0.8" y2="1">
                <stop stop-color="#ffffff"/>
                <stop offset="0.5" stop-color="#f4f4f5"/>
                <stop offset="1" stop-color="#a7a8ab"/>
              </linearGradient>
            </defs>
            <path fill="url(#boot-logo-silver)" fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
            <path fill="url(#boot-logo-silver)" d="M517.36 400H634.72V634.72H517.36Z"/>
          </svg>
        </div>
        <strong class="boot-title">PiDeck-Q</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
