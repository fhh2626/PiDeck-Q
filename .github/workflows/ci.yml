name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, type-check and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Setup Python for node-pty
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Generate app icon
        run: npm run make-icon

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer, Node sidecar and Qt host
        run: npm run pack
