name: Build Windows

# Qt/WebView2 native host currently ships Windows x64 only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 native package
    runs-on: windows-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Setup Python for node-pty
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install dependencies
        run: npm ci

      - name: Build Windows native staging
        run: npm run dist:win
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pideck-q-windows-x64
          if-no-files-found: error
          path: release/win-unpacked
