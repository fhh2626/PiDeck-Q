name: Release Windows ZIP

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a smoke-tested preview (leave off to build one)
        type: boolean
        default: false
      preview_run_id:
        description: Actions run ID of the tested preview (required when publishing)
        type: string
        default: ''
      zip_sha256:
        description: SHA-256 of the ZIP you smoke-tested (required when publishing)
        type: string
        default: ''
      prerelease:
        description: Mark this release as a prerelease
        type: boolean
        default: false
      release_notes:
        description: Summary of the main changes (required when publishing)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  drafts:
    if: ${{ !inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The Releases API only returns drafts to callers with push access. This
    # job never checks out or runs repository code with its write token.
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - name: Read occupied draft tags for the release preview
        id: list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c '[.[][] | select(.draft) | .tag_name]')
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

  windows:
    needs: drafts
    # native2 can build a preview without looking up unpublished versions.
    if: ${{ !cancelled() && !inputs.publish && (needs.drafts.result == 'success' || (github.ref != 'refs/heads/main' && needs.drafts.result == 'skipped')) }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Validate build branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notin @('refs/heads/main', 'refs/heads/native2')) {
            throw 'Select main or native2 for a release build.'
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Select the release version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAGS: ${{ needs.drafts.outputs.tags }}
        run: |
          $refs = git ls-remote --tags --refs origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagNames = @($refs | ForEach-Object { ($_ -split '\trefs/tags/', 2)[1] }) + @($releases)
          # Draft releases may not have a Git tag yet. Reserve their names too.
          if ($env:DRAFT_TAGS) { $tagNames += @(ConvertFrom-Json -InputObject $env:DRAFT_TAGS) }
          # Write stdin even for a repository with no tags or releases.
          (($tagNames -join "`n") + "`n") | node scripts/plan-windows-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add 7-Zip to PATH for the Qt SDK and archive steps
        shell: pwsh
        run: |
          $directory = Join-Path $env:ProgramFiles '7-Zip'
          if (-not (Test-Path -LiteralPath (Join-Path $directory '7z.exe') -PathType Leaf)) {
            throw '7-Zip is required on the Windows runner.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.0.8'
      - run: npm ci
      - run: npm test
      - name: Build and verify the Windows x64 package
        env:
          PIDECK_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: npm run pack
      - name: Compress and test the ZIP
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.plan.outputs.filename }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP $env:ZIP_NAME
          Push-Location 'release/win-unpacked'
          try {
            7z a -tzip -mx=5 $zip '.\*'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          7z t $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @("### Windows preview", "- Run ID: $env:GITHUB_RUN_ID", "- Commit: $env:GITHUB_SHA", "- ZIP: $env:ZIP_NAME", "- SHA-256: $sha256") |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Save the ZIP for download and publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-zip-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.plan.outputs.filename }}
          compression-level: 0
          if-no-files-found: error

  publish:
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require the default release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publish from main. Other branches can build a preview ZIP.' >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate the preview run
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          ZIP_SHA256: ${{ inputs.zip_sha256 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          artifact=$(node scripts/publish-windows-release.mjs plan)
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - name: Download that preview ZIP without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.preview.outputs.artifact }}
          path: release-asset
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
      - name: Promote the smoke-tested ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          ZIP_SHA256: ${{ inputs.zip_sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: node scripts/publish-windows-release.mjs publish
