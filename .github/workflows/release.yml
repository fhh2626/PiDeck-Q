name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          指定 tag（如 vX.Y.Z）则按该 tag 的代码打包。
          留空则用当前分支最新 commit + package.json 版本号正式发布（自动 tag vX.Y.Z）。
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      target_commitish: ${{ steps.resolve.outputs.target_commitish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version and ref
        id: resolve
        run: |
          TARGET_COMMITISH=""
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            REF="refs/tags/${TAG}"
            VERSION="${TAG#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            REF=""
            TARGET_COMMITISH="${GITHUB_SHA}"
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag ${VERSION} does not match package.json version ${PACKAGE_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "target_commitish=${TARGET_COMMITISH}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Windows native release
    needs: [resolve-version]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Setup Python for node-pty
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install dependencies
        run: npm ci

      - name: Build Windows native staging
        run: npm run dist:win
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "release/win-unpacked"
          if (-not (Test-Path "$stage/PiDeck-Q.exe")) { throw "Native staging executable is missing: $stage/PiDeck-Q.exe" }
          $zip = "release/PiDeck-Q-${{ needs.resolve-version.outputs.version }}-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive `
            -Path "release/win-unpacked/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created: $zip" }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          repository: fhh2626/PiDeck-Q
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          target_commitish: ${{ needs.resolve-version.outputs.target_commitish }}
          body: Release v${{ needs.resolve-version.outputs.version }} (Qt native Windows portable ZIP)
          files: release/PiDeck-Q-${{ needs.resolve-version.outputs.version }}-win-x64.zip
          fail_on_unmatched_files: true
          draft: false
